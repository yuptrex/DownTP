<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TextPro — Edit. Style. Perfect.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --panel:#0A0A0A;
    --blue:#2F6BFF;
    --blue-light:#7FA8FF;
    --text:#EAF0FF;
    --muted:#4A5578;
    --muted-2:#8891B0;
    --line:rgba(127,168,255,0.14);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;
    overflow:hidden;
  }
  body{
    background:var(--bg);color:var(--text);
    font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
  }
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  ::selection{background:var(--blue);color:#fff;}
  :focus-visible{outline:2px solid var(--blue-light);outline-offset:3px;}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}

  .bg-field{
    position:fixed;inset:0;z-index:0;
    background: var(--bg);
    pointer-events:none;
  }
  .bg-field::before{
    content:'';position:absolute;inset:0;
    background-image:
      radial-gradient(rgba(127,168,255,0.35) 1px, transparent 1px),
      radial-gradient(rgba(127,168,255,0.22) 1px, transparent 1px);
    background-size:120px 120px, 170px 170px;
    background-position:0 0, 60px 90px;
    opacity:0.35;
    animation:drift-field 90s linear infinite;
  }
  .bg-field::after{
    content:'';position:absolute;inset:-10%;
    background:radial-gradient(ellipse 60% 45% at 50% 46%, rgba(47,107,255,0.10), transparent 65%);
    animation:breathe-field 10s ease-in-out infinite;
  }
  @keyframes drift-field{
    0%{transform:translate3d(0,0,0);}
    100%{transform:translate3d(-170px,-120px,0);}
  }
  @keyframes breathe-field{
    0%,100%{opacity:0.6;transform:scale(1);}
    50%{opacity:1;transform:scale(1.06);}
  }

  .brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-0.01em;}
  .brand .mark{flex-shrink:0;}
  .brand b{color:var(--blue-light);font-weight:700;}

  /* ================= HEADER (logo only, no nav links) ================= */
  header.top-nav{
    position:relative;z-index:50;
    display:flex;align-items:center;justify-content:center;
    padding:18px 24px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
    opacity:0;
    animation:fade-down .7s ease .05s forwards;
  }
  header.top-nav .brand{font-size:19px;}
  header.top-nav .brand .mark svg{width:26px;height:26px;display:block;}
  header.top-nav .brand b{
    background:linear-gradient(90deg, var(--blue-light), var(--blue), var(--blue-light));
    background-size:200% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine-text 6s linear infinite;
  }

  @keyframes fade-down{
    from{opacity:0;transform:translateY(-10px);}
    to{opacity:1;transform:translateY(0);}
  }
  @keyframes shine-text{
    0%{background-position:0% center;}
    100%{background-position:200% center;}
  }

  /* ================= MAIN (fills remaining viewport, no scroll) ================= */
  main{
    position:relative;z-index:2;
    flex:1;min-height:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    padding:12px 24px;
    gap:10px;
  }

  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    padding:6px 13px;border:1px solid var(--line);border-radius:999px;
    font-size:12px;color:var(--blue-light);font-weight:500;
    background:rgba(47,107,255,0.06);
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--blue-light);box-shadow:0 0 8px var(--blue-light);}

  .logo-visual{
    width:min(880px, 82vh);
    height:min(560px, 54vh);
    position:relative;
    display:flex;align-items:center;justify-content:center;
    opacity:0;
    animation:logo-in 1s cubic-bezier(.16,1,.3,1) .15s forwards;
  }
  .logo-visual img{
    width:100%;height:100%;object-fit:contain;
    animation:logo-float 7s ease-in-out infinite;
  }

  @keyframes logo-in{
    from{opacity:0;transform:scale(0.92) translateY(14px);}
    to{opacity:1;transform:scale(1) translateY(0);}
  }
  @keyframes logo-float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-12px);}
  }

  main h1{font-size:clamp(34px,5.5vh,54px);line-height:1;font-weight:700;letter-spacing:-0.03em;}
  main h1 .accent{color:var(--blue-light);}
  main .tagline{
    font-size:clamp(15px,2.2vh,19px);color:var(--muted-2);font-weight:500;
    letter-spacing:0.02em;
    opacity:0;animation:fade-up .7s ease .55s forwards;
  }
  main p.sub{
    font-size:clamp(13px,1.8vh,15.5px);color:var(--muted-2);line-height:1.5;max-width:420px;
    opacity:0;animation:fade-up .7s ease .68s forwards;
  }
  @keyframes fade-up{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }

  .download-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    background:var(--blue);color:#fff;font-weight:600;font-size:15.5px;
    padding:14px 30px;border-radius:12px;
    transition:transform .2s ease, box-shadow .2s ease, background .2s ease;
    margin-top:4px;
    position:relative;overflow:hidden;
    opacity:0;animation:fade-up .7s ease .8s forwards;
  }
  .download-btn::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(115deg, transparent 20%, rgba(255,255,255,0.35) 40%, transparent 60%);
    transform:translateX(-120%);
  }
  .download-btn:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(47,107,255,0.45);background:#3d78ff;}
  .download-btn:hover::before{transform:translateX(120%);transition:transform .7s ease;}
  .download-btn:active{transform:scale(0.98);}
  .download-btn svg{width:18px;height:18px;}
  .download-btn.loading{pointer-events:none;opacity:0.7;}
  .file-meta-line{
    font-size:12px;color:var(--muted);
    opacity:0;animation:fade-up .7s ease .9s forwards;
  }
  .download-error{
    font-size:12px;color:#ff6b6b;
    display:none;
    max-width:320px;
    line-height:1.5;
  }
  .download-error.show{display:block;}

  footer.bottom-bar{
    position:relative;z-index:2;flex-shrink:0;
    border-top:1px solid var(--line);padding:12px 24px;
    opacity:0;animation:fade-up .7s ease 1s forwards;
    text-align:center;font-size:12px;color:var(--muted);
  }
</style>
</head>
<body>

<div class="bg-field"></div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="icon-download"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
  </defs>
</svg>

<header class="top-nav">
  <div class="brand">
    <span>Text<b>Pro</b></span>
  </div>
</header>

<main>
  <div class="logo-visual">
    <img src="TP.png" alt="TextPro logo">
  </div>

  <div class="tagline">Connect • Share • Loop</div>
  <p class="sub">Find and connect with your close ones</p>

  <a href="TextPro.apk" download="TextPro.apk" class="download-btn" id="downloadBtn">
    <svg><use href="#icon-download"/></svg>
    <span id="btnLabel">Download for Android</span>
  </a>
  <div class="file-meta-line">Android · v2.5.0 · 7 MB</div>
  <div class="download-error" id="downloadError">
    File not found or failed to load. Make sure TextPro.apk is committed to the repo root (not tracked via Git LFS) and try again.
  </div>
</main>

<footer class="bottom-bar">
  © 2026 TextPro. Independent Android release.
</footer>

<script>
  // Verifies the APK responds before triggering the download, but never
  // blocks the actual download on an inconclusive check — GitHub Pages'
  // CDN doesn't always return content-length on HEAD requests, so the
  // check only fails loudly on a real HTTP error (404/403/etc), not on
  // a missing header.
  const btn = document.getElementById('downloadBtn');
  const btnLabel = document.getElementById('btnLabel');
  const errorBox = document.getElementById('downloadError');
  const APK_PATH = 'TextPro.apk';

  function triggerDownload() {
    const link = document.createElement('a');
    link.href = APK_PATH;
    link.download = 'TextPro.apk';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  btn.addEventListener('click', async function (e) {
    e.preventDefault();
    errorBox.classList.remove('show');
    btn.classList.add('loading');
    btnLabel.textContent = 'Checking file…';

    try {
      const res = await fetch(APK_PATH, { method: 'HEAD', cache: 'no-store' });

      if (!res.ok) {
        // A real HTTP error (404, 403, etc) — the file genuinely isn't there.
        throw new Error('HTTP ' + res.status);
      }

      const lenHeader = res.headers.get('content-length');
      if (lenHeader !== null && parseInt(lenHeader, 10) < 50000) {
        // Header IS present and clearly too small — likely an LFS pointer
        // file or a 404 page served with a 200 status.
        throw new Error('File too small: ' + lenHeader + ' bytes');
      }

      // Either the size looks right, or the header just wasn't sent
      // (common on GitHub Pages) — proceed with the download either way.
      btnLabel.textContent = 'Download for Android';
      btn.classList.remove('loading');
      triggerDownload();
    } catch (err) {
      console.error('Download pre-check failed:', err);
      btn.classList.remove('loading');
      btnLabel.textContent = 'Download for Android';
      errorBox.classList.add('show');
    }
  });
</script>

</body>
</html>
